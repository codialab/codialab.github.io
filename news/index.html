---
layout: default
title: News
---

<h1 class="page-name">News</h1>

{% include page-nav.html %}

<div class="posts">
  {% for post in paginator.posts %}
    <article class="post">
      <!-- Added a bottom margin to restore the spacing -->
      <h4 class="mainHeading" style="margin-bottom: 10px;">
        <!-- Added styling so the link inherits standard text color but stays clickable -->
        <a href="{{ site.baseurl }}{{ post.url }}" style="color: inherit; text-decoration: none;">
      {{ post.title }}
        </a>
    </h4>
    <div style="color: gray;">{{ post.date | date: "%B %e, %Y" }}</div>
  </article>
  {% endfor %}
</div>

{% include page-nav.html %}
